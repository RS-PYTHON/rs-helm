{{ if .Values.app }}
{{ if .Values.app.S3FS }}
{{ if .Values.app.S3FS.enabled }}
kind: ConfigMap
metadata:
  name: s3fs-start-script
  namespace: {{ .Values.namespace }}
apiVersion: v1
data:
  start.sh: |-
    #!/bin/sh

    apt update -y ;
    apt install s3fs -y ;

    mkdir -p /app/vsftpd/users/${FTP_USER}/NOMINAL ;

    s3fs rs-dev-cluster-temp:/stations/EDRS /app/vsftpd/users/${FTP_USER}/NOMINAL -o passwd_file=/etc/passwd-s3fs/edrs -o use_path_request_style -o nonempty -o allow_other -o uid=1000 -o gid=1000 -o mp_umask=0002 -o umask=0002 -o url={{ .Values.obs.endpoint }} -o compat_dir ;

    sleep 3650d ;

---

kind: ConfigMap
metadata:
  name: s3fs-umount-script
apiVersion: v1
data:
  umount.sh: |-
    #!/bin/sh

    echo "Unmount s3fs ..."

    ! umount /app/vsftpd/users/${FTP_USER}/NOMINAL || umount /app/vsftpd/users/${FTP_USER}/NOMINAL ;

{{ end }}
{{ end }}
{{ end }}
