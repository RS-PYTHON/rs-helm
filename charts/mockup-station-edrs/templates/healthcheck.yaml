apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-healthcheck-script
  namespace: {{ .Values.namespace }}
  {{ if .Values.helmResourcePolicy }}
  annotations:
    helm.sh/resource-policy: {{ .Values.helmResourcePolicy }}
  {{ end }}
data:
  healthcheck.py: |
    from flask import Flask
    from ftplib import FTP,FTP_TLS
    import ssl
    import os
    import time
    import threading
    import traceback

    app = Flask(__name__)

    FTP_HOST = "localhost"
    FTP_PORT = 21
    FTP_USER = os.getenv("FTP_USER")
    FTP_PASS = os.getenv("FTP_PASS")

    CLIENT_CERT = "/certs/tls.crt"
    CLIENT_KEY = "/certs/tls.key"
    CA_CERT = "/certs/ca.crt"

    ftp_ready = False

    def debug(msg):
        """Simple timestamped debug print."""
        print(f"[{time.strftime('%Y-%m-%d %H:%M:%S')}] {msg}", flush=True)

    def check_ftp():
        global ftp_ready
        interval = int(os.getenv("FTP_CHECK_INTERVAL", "30"))
        while True:
            debug("Starting FTP check...")
            try:

                # Read environment variable (defaults to FALSE)
                use_ssl_env = os.getenv("SSL_ENABLE", "FALSE").strip().lower()
                use_ssl = use_ssl_env in ["1", "true", "yes"]
                
                if use_ssl:
                    debug("Connecting via FTPES (explicit TLS)...")

                    if not all(os.path.exists(p) for p in [CLIENT_CERT, CLIENT_KEY, CA_CERT]):
                        debug("One or more certificate files are missing!")
                        debug(f"CLIENT_CERT exists: {os.path.exists(CLIENT_CERT)}")
                        debug(f"CLIENT_KEY exists: {os.path.exists(CLIENT_KEY)}")
                        debug(f"CA_CERT exists: {os.path.exists(CA_CERT)}")
                        ftp_ready = False
                    else:
                        # Create and configure SSL context
                        context = ssl.create_default_context(ssl.Purpose.SERVER_AUTH)
                        context.check_hostname = False
                        context.verify_mode = ssl.CERT_REQUIRED
                        context.load_verify_locations(cafile=CA_CERT)
                        context.load_cert_chain(certfile=CLIENT_CERT, keyfile=CLIENT_KEY)

                        debug("SSL context created and certificates loaded successfully.")

                        # Create FTP_TLS connection
                        ftps = FTP_TLS()
                        ftps.ssl_version = ssl.PROTOCOL_TLS
                        ftps.context = context

                        debug(f"Connecting to {FTP_HOST}:{FTP_PORT}...")
                        ftps.connect(FTP_HOST, FTP_PORT, timeout=5)
                        debug("Connected to FTP server.")

                        ftps.auth()
                        debug("TLS handshake successful (AUTH TLS).")

                        ftps.login(FTP_USER, FTP_PASS)
                        debug("Logged in successfully.")

                        try:
                            files = ftps.nlst()
                            debug(f"Directory listing: {files}")
                        except Exception as e:
                            debug(f"Failed to list directory contents: {e}")

                        ftps.quit()
                        ftp_ready = True
                        debug("FTP is ready.")
                else:
                    debug("Connecting via plain FTP (no SSL)...")
                    ftp = FTP()
                    ftp.connect(FTP_HOST, FTP_PORT, timeout=5)
                    debug("Connected to FTP server.")
                    ftp.login(FTP_USER, FTP_PASS)
                    debug("Logged in successfully.")

                    try:
                        files = ftp.nlst()
                        debug(f"Directory listing: {files}")
                    except Exception as e:
                        debug(f"Failed to list directory contents: {e}")

                    ftp.quit()
                    ftp_ready = True
                    debug("FTP is ready.")
            except Exception as e:
                ftp_ready = False
                debug(f"FTP not ready: {e}")
                traceback.print_exc()

            debug(f"Sleeping for {interval} seconds before next check...")
            time.sleep(interval)

    @app.route("/healthz")
    def healthz():
        if ftp_ready:
            return "OK", 200
        else:
            return "FTP not ready", 503

    if __name__ == "__main__":
        debug("Starting healthcheck service...")
        threading.Thread(target=check_ftp, daemon=True).start()
        app.run(host="0.0.0.0", port=8080)
