kind: StatefulSet
apiVersion: apps/v1
metadata:
  name: {{ .Release.Name }}
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "mychart.Labels" . | nindent 4 }}
spec:
  selector:
    matchLabels:
      {{- include "mychart.selectorLabels" . | nindent 6 }}
  replicas: {{ .Values.replicaCount }}
  podManagementPolicy: Parallel
  updateStrategy:
    rollingUpdate:
      partition: 0
  serviceName: {{ .Release.Name }}-headless
  template:
    metadata:
      name: {{ .Release.Name }}
      labels:
        {{- include "mychart.selectorLabels" . | nindent 8 }}
    spec:
      terminationGracePeriodSeconds: 30
      {{- with .Values.initContainers }}
      initContainers:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
      - name: ftp-healthcheck
        image: python:3.14-slim
        command: ["/bin/sh", "-c"]
        args:
          - pip install flask && python /healthcheck/healthcheck.py
        ports:
          - containerPort: 8080
        envFrom:
        - secretRef:
            name: {{ .Release.Name }}-user
        env:
          - name: SSL_GENERATE
            value: "NO"
        securityContext:
          privileged: false
        volumeMounts:
          - name: client-ftp-certs
            mountPath: /certs
            readOnly: true
          - name: healthcheck-script
            mountPath: /healthcheck
            readOnly: true
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 10
      - name: {{ .Release.Name }}
        image: "{{ template "mychart.image" .Values.image }}"
        imagePullPolicy: {{ .Values.image.PullPolicy }}
        resources:
          requests:
            memory: {{ .Values.resources.request.ram }}
            cpu: {{ .Values.resources.request.cpu }}
          limits:
            memory: {{ .Values.resources.limit.ram }}
            cpu: {{ .Values.resources.limit.cpu }}
        volumeMounts:
        - name: service-config-volume
          mountPath: {{ .Values.app.confDir }}/{{ .Values.app.authConfigFile }}
          subPath: {{ .Values.app.authConfigFile }}
        - name: catalog-config-volume
          mountPath: {{ .Values.app.confDir }}/Catalog/{{ .Values.app.catalogConfigFile }}
          subPath: {{ .Values.app.catalogConfigFile }}
        - mountPath: /opt/edrs/config/Storage
          name: opt-edrs
        ports:
        - name: web
          protocol: TCP
          containerPort: {{ .Values.app.port }}
        envFrom:
        - secretRef:
            name: {{ .Release.Name }}-obs
        - secretRef:
            name: {{ .Release.Name }}-user
        env:
        - name: S3_ENDPOINT
          value: {{ .Values.obs.endpoint }}
        - name: S3_REGION
          value: {{ .Values.obs.region }}
        securityContext:
          privileged: false
      {{ if .Values.image }}
      {{ if .Values.image.imagePullSecrets }}
      imagePullSecrets:
      - name:  {{ .Values.image.imagePullSecrets }}
      {{ end }}
      {{ end }}
      restartPolicy: Always
      securityContext: {}
      volumes:
      - name: client-ftp-certs
        secret:
          secretName: {{ .Release.Name }}-client-tls
      - name: server-ftp-certs
        secret:
          secretName: {{ .Release.Name }}-server-tls
      - name: healthcheck-script
        configMap:
          name: {{ .Release.Name }}-healthcheck-script
      - name: service-config-volume
        configMap:
          name: {{ .Release.Name }}-service-config
      - name: catalog-config-volume
        configMap:
          name: {{ .Release.Name }}-catalog-config
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
  volumeClaimTemplates:
    - metadata:
        name: opt-edrs
        annotations:
          helm.sh/resource-policy: {{ .Values.helmResourcePolicy }}
      spec:
        accessModes:
          - ReadWriteOnce
        storageClassName: {{ .Values.volume.storageClassName }}
        resources:
          requests:
            storage: {{ .Values.volume.size }}
  revisionHistoryLimit: 10
