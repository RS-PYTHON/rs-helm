apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-service-config
  namespace: {{ .Values.namespace }}
data:
  {{ .Values.app.eodagConfigFile }}: |
    {{- range $k, $v := .Values.app.station }}
      {{ $k }}:
        auth:
          type: TokenAuth
          auth_uri: PLACEHOLDER
          token_type: json
          token_key: access_token
          refresh_token_key: refresh_token
          token_expiration_key: expires_in
          request_method: POST
          req_data:
            client_id: PLACEHOLDER
            client_secret: PLACEHOLDER
            grant_type: PLACEHOLDER
            username: PLACEHOLDER
            password: PLACEHOLDER
          credentials:
            auth_for_token: PLACEHOLDER
          headers:
            Content-Type: application/x-www-form-urlencoded
          retrieve_headers:
            Content-Type: application/x-www-form-urlencoded
            Authorization: '{auth_for_token}'
        products:
          S1_SAR_RAW:
            productType: IW_RAW__0N
        search:
          type: ODataV4Search
          api_endpoint: {{ $v.endpoint.url }}
          need_auth: true
          results_entry: $.value | $
          metadata_mapping:
            id:
            - null
            - $.Id
            prip:id:
            - null
            - $.Id
            Name:
            - null
            - $.Name
            ContentLength:
            - null
            - $.ContentLength
            ContentType:
            - null
            - $.ContentType
            PublicationDate:
            - null
            - $.PublicationDate
            EvictionDate:
            - null
            - $.EvictionDate
            DatetimeStart:
            - null
            - $.ContentDate.Start
            Start:
            - null
            - $.ContentDate.Start
            End:
            - null
            - $.ContentDate.End
            StartPublicationDate:
            - null
            - $.PublicationDate
            StopPublicationDate:
            - null
            - $.PublicationDate
            GeoFootprint:
            - null
            - $.GeoFootprint
            OriginDate:
            - null
            - $.OriginDate
            ProductionType:
            - null
            - $.ProductionType
            ChecksumValue:
            - null
            - '{$.Checksum[0].Value#to_lower}'
            attr_ptype:
            - null
            - $.attr_ptype
            attr_ptypes:
            - null
            - $.attr_ptype
            platformSerialIdentifier:
            - null
            - $.platformSerialIdentifier
            platformSerialIdentifiers:
            - null
            - $.platformSerialIdentifier
            platformShortName:
            - null
            - $.platformShortName
            platformShortNames:
            - null
            - $.platformShortName
            processing:datetime:
            - null
            - $.processing:datetime
            processingCenter:
            - null
            - $.processingCenter
            processorVersion:
            - null
            - $.Attributes[?(@.Name=='processorVersion')].Value
            attrs:
            - null
            - $.Attributes
            href:
            - null
            - {{ $v.endpoint.url }}({id})/$value
            geometry: POLYGON((180 -90, 180 90, -180 90, -180 -90, 180 -90))
            downloadLink: {{ $v.endpoint.url }}({id})/$value
            title: $.Name
            intersects:
            - null
            - $.intersects
          free_text_search_operations:
            $filter:
              union: ' OR '
              wrapper: '{}'
              operations:
                and:
               # ---- Name-based matches (contains/startswith/endswith) ----
                - "Name eq '{Name_eq}'"
                - "contains(Name, '{Name}')"
                - "contains(Name, '{Name_contains}')"
                - "startswith(Name, '{Name_startswith}')"
                - "endswith(Name, '{Name_endswith}')"
                # ---- Id match (existing) ----
                - "contains(Id, '{prip:id}')"
                # ---- Time on PublicationDate ----
                - "(PublicationDate gt {StartPublicationDate#to_iso_utc_datetime} or PublicationDate eq {StartPublicationDate#to_iso_utc_datetime})"
                - "(PublicationDate lt {StopPublicationDate#to_iso_utc_datetime} or PublicationDate eq {StopPublicationDate#to_iso_utc_datetime})"
                - "PublicationDate eq {PublicationDate#to_iso_utc_datetime}"
                # ---- Exact equality on other top-level PRIP fields ----
                - "EvictionDate eq {EvictionDate#to_iso_utc_datetime}"
                - "ModificationDate eq {ModificationDate#to_iso_utc_datetime}"
                - "OriginDate eq {OriginDate#to_iso_utc_datetime}"
                - "Online eq {Online}"
                - "ContentDate/Start eq {DatetimeStart#to_iso_utc_datetime}"
                - "ContentDate/Start eq {Start#to_iso_utc_datetime}"
                - "ContentDate/End eq {End#to_iso_utc_datetime}"
                # ---- Spatial Intersects  ----
                # Provide a full WKT geometry like: POLYGON((-60 0,-62 -10,-58 -10,-56 0,-60 0))
                - "OData.CSC.Intersects(area=geography'SRID=4326;{intersects}')"
                # ---- Attributes[...] == value (StringAttribute) ----
                - "Attributes/OData.CSC.StringAttribute/any(att:att/Name eq 'productType' and att/OData.CSC.StringAttribute/Value eq {attr_ptype})"
                - "Attributes/OData.CSC.StringAttribute/any(att:att/Name eq 'productType' and att/OData.CSC.StringAttribute/Value in ({attr_ptypes}))"
                - "Attributes/OData.CSC.StringAttribute/any(att:att/Name eq 'platformShortName' and att/OData.CSC.StringAttribute/Value eq {platformShortName#to_upper})"
