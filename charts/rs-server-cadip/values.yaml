# -- Namespace for the deployment
namespace: processing

# -- Number of replicas for the deployment
replicaCount: 1

service:
  # -- Port for the service
  port: 8080

app:
  # -- Port for the application
  port: 8000
  # -- Working directory for the application
  workDir: /app
  # -- Config directory for the application
  confDir: /app/conf
  # -- Cadip search configuration file for the application
  cadipSearchConfigFile: cadip_search_config.yaml
  # -- EODAG configuration file for the application. If useTokenModule is true the cadip_ws_config_token_module.yaml
  # -- shall be used. When useTokenModule is false, the cadip_ws_config.yaml shall be used.
  # -- Set properly the EODAG_CADIP_CONFIG env var.
  eodagConfigFile: cadip_ws_config.yaml
  eodagConfigFileTokenModule: cadip_ws_config_token_module.yaml
  # -- The method for loading the token for external stations: use the custom module or 
  # -- allow EODAG to handle it (set it to false for EODAG).
  useTokenModule: false
  station:
    # -- CADIP station name
    cadip:
      endpoint:
        # -- CADIP station URL
        url:
          token: http://mockup-station-cadip-cadip.processing.svc.cluster.local:8080/oauth2/token
          odata: http://mockup-station-cadip-cadip.processing.svc.cluster.local:8080
    # @ignored
    sgs:
      endpoint:
        url: 
          token: http://mockup-station-cadip-sgs.processing.svc.cluster.local:8080/oauth2/token
          odata: http://mockup-station-cadip-sgs.processing.svc.cluster.local:8080
    # @ignored
    mti:
      endpoint:
        url: 
          token: http://mockup-station-cadip-mti.processing.svc.cluster.local:8080/oauth2/token
          odata: http://mockup-station-cadip-mti.processing.svc.cluster.local:8080
  # -- URL of the API Key Manager service
  uacURL: http://apikeymanager.processing.svc.cluster.local:8000/auth/check_key

probe:
  startup:
    # -- Path for the liveness probe
    path: /health
    # -- Port for the liveness probe
    port: 8000
    # -- InitialDelaySeconds for the liveness probe
    initialDelaySeconds: 10
    # -- periodSeconds for the liveness probe
    periodSeconds: 2
    # -- timeoutSeconds for the liveness probe
    timeoutSeconds: 1
  liveness:
    # -- Path for the liveness probe
    path: /health
    # -- Port for the liveness probe
    port: 8000
    # -- InitialDelaySeconds for the liveness probe
    initialDelaySeconds: 0
    # -- periodSeconds for the liveness probe
    periodSeconds: 30
    # -- timeoutSeconds for the liveness probe
    timeoutSeconds: 5
  readiness:
    # -- Path for the readiness probe
    path: /health
    # -- Port for the readiness probe
    port: 8000
    # -- InitialDelaySeconds for the readiness probe
    initialDelaySeconds: 0
    # -- periodSeconds for the readiness probe
    periodSeconds: 30
    # -- timeoutSeconds for the readiness probe
    timeoutSeconds: 5

# -- Pod affinity
affinity: {}

# -- Pod toleration
tolerations: []

# -- Pod initContainers
initContainers: []

obs:
  # -- URL of the object storage service endpoint
  endpoint: http://minio.minio.svc.cluster.local:9000
  # -- Region of the object storage service
  region: sbg
  secret:
    # -- Access Key to authenticate with the object storage service
    ak: TDr8foJqSygBQ9YFmWDy
    # -- Secret Key to authenticate with the object storage service
    sk: z2RaqjFttnVZRTsLLqmy4PE6PzJOKzPsE47alDBs

auth:
  secret:
    # -- OIDC End Point
    oidc_endpoint: ""
    # -- OIDC Realm
    oidc_realm: ""
    # -- OIDC CLient ID
    oidc_client_id: ""
    # -- OIDC Secret used to sync user info from Keycloak
    oidc_client_secret: ""
    # -- Random string used to encode cookie-based HTTP sessions in SessionMiddleware
    cookie_secret: ""

image:
  #imagePullSecrets: regcred
  # -- Image registry
  registry: ghcr.io
  # -- Image repository
  repository: rs-python
  # -- Image name
  name: rs-server-cadip
  # -- Image version, can be a tag or a digest
  version: 0.2a15
  # -- Image pull policy
  PullPolicy: IfNotPresent
  #imagePullSecrets: regcred

ingress:
  # -- Enabled/Disable ingress
  enabled: true
  issuer:
    # -- Ingress Issuer type
    type: cluster-issuer
    # -- Ingress Issuer name
    name: letsencrypt-prod
  # -- Ingress host name
  host: subdomain.example.com
  # -- Ingress path
  path: /cadip

resources:
  request:
    # -- Pod memory request
    ram: "256Mi"
    # -- Pod CPU request
    cpu: "100m"
  limit:
    # -- Pod memory limit
    ram: "1000Mi"
    # -- Pod CPU limit
    cpu: "500m"

stac_browser:
  urls: "https://stac-browser-cadip.subdomain.example.com;https://stac-browser-catalog.subdomain.example.com"

tempo:
  # -- Grafana tempo endpoint.
  endpoint: http://grafana-tempo-distributor.logging.svc.cluster.local:4317

otel:
  # -- Trace request headers with OpenTelemetry ?
  trace_headers: false
  # -- Trace request bodies and response contents with OpenTelemetry ?
  trace_body: false