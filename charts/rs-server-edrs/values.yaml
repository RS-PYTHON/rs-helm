# -- Namespace for the deployment
namespace: processing

# -- Number of replicas for the deployment
replicaCount: 1

service:
  # -- Port for the service
  port: 8080

app:
  # -- Port for the application
  port: 8000
  # -- Config directory for the application
  confDir: /app/conf
  edrsSearchConfigFile: edrs_search_config.yaml
  edrsStations: edrs_stations.yaml
  # -- The way the token for the external stations is loaded: own module or let eodag to do it (set it to false)
  useTokenModule: false
  useSSL: true
  station:
    pedc:
      service:
        # -- EDRS PEDC service name
        name: edrs
        # -- EDRS PEDC station URL
        url: mockup-station-edrs.processing.svc.cluster.local
        # -- EDRS PEDC station port
        port: 21
      # -- EDRS PEDC domain
      domain: mockup-station-edrs.processing.svc.cluster.local
      authentication:
        # -- EDRS PEDC authentication type
        auth_type: ftp
        # -- EDRS PEDC authentication username
        username: test
        # -- EDRS PEDC authentication password
        password: test
        # -- EDRS PEDC CA certificate path
        ca_crt: /certs/ca.crt
        # -- EDRS PEDC client certificate path
        client_crt: /certs/tls.crt
        # -- EDRS PEDC client key path
        client_key: /certs/tls.key
    bedc:
      service:
        # -- EDRS BEDC service name
        name: edrs
        # -- EDRS BEDC station URL
        url: mockup-station-edrs.processing.svc.cluster.local
        # -- EDRS BEDC station port
        port: 21
      # -- EDRS BEDC domain
      domain: mockup-station-edrs.processing.svc.cluster.local
      authentication:
        # -- EDRS BEDC authentication type
        auth_type: ftp
        # -- EDRS BEDC authentication username
        username: test
        # -- EDRS BEDC authentication password
        password: test
        # -- EDRS BEDC CA certificate path
        ca_crt: /certs/ca.crt
        # -- EDRS BEDC client certificate path
        client_crt: /certs/tls.crt
        # -- EDRS BEDC client key path
        client_key: /certs/tls.key
  # -- URL of the API Key Manager service
  uacURL: http://apikeymanager.processing.svc.cluster.local:8000/auth/check_key

probe:
  startup:
    # -- Path for the liveness probe
    path: /health
    # -- Port for the liveness probe
    port: 8000
    # -- InitialDelaySeconds for the liveness probe
    initialDelaySeconds: 10
    # -- periodSeconds for the liveness probe
    periodSeconds: 2
    # -- timeoutSeconds for the liveness probe
    timeoutSeconds: 1
  liveness:
    # -- Path for the liveness probe
    path: /health
    # -- Port for the liveness probe
    port: 8000
    # -- InitialDelaySeconds for the liveness probe
    initialDelaySeconds: 0
    # -- periodSeconds for the liveness probe
    periodSeconds: 30
    # -- timeoutSeconds for the liveness probe
    timeoutSeconds: 5
  readiness:
    # -- Path for the readiness probe
    path: /health
    # -- Port for the readiness probe
    port: 8000
    # -- InitialDelaySeconds for the readiness probe
    initialDelaySeconds: 0
    # -- periodSeconds for the readiness probe
    periodSeconds: 30
    # -- timeoutSeconds for the readiness probe
    timeoutSeconds: 5

obs:
  # -- URL of the object storage service endpoint
  endpoint: http://minio.minio.svc.cluster.local:9000
  # -- Region of the object storage service
  region: sbg
  secret:
    # -- Access Key to authenticate with the object storage service
    ak: TDr8foJqSygBQ9YFmWDy
    # -- Secret Key to authenticate with the object storage service
    sk: z2RaqjFttnVZRTsLLqmy4PE6PzJOKzPsE47alDBs

auth:
  secret:
    # -- OIDC End Point
    oidc_endpoint: ""
    # -- OIDC Realm
    oidc_realm: ""
    # -- OIDC CLient ID
    oidc_client_id: ""
    # -- OIDC Secret used to sync user info from Keycloak
    oidc_client_secret: ""
    # -- Random string used to encode cookie-based HTTP sessions in SessionMiddleware
    cookie_secret: ""

image:
  # -- Image registry
  registry: ghcr.io
  # -- Image repository
  repository: rs-python
  # -- Image name
  name: rs-server-edrs
  # -- Image version, can be a tag or a digest
  version: "latest"
  # -- Image pull policy
  PullPolicy: IfNotPresent

ingress:
  # -- Enabled/Disable ingress
  enabled: true
  issuer:
    # -- Ingress Issuer type
    type: cluster-issuer
    # -- Ingress Issuer name
    name: letsencrypt-prod
  # -- Ingress host name
  host: subdomain.example.com
  # -- Ingress path
  path:
    - /edrs

resources:
  request:
    # -- Pod memory request
    ram: "256Mi"
    # -- Pod CPU request
    cpu: "100m"
  limit:
    # -- Pod memory limit
    ram: "1000Mi"
    # -- Pod CPU limit
    cpu: "500m"

# -- Pod affinity
affinity: {}

# -- Pod toleration
tolerations: []

# -- Pod initContainers
initContainers: []

cors:
  # -- A list of origins that should be permitted to make cross-origin requests. Needed for STAC Browser
  origins: https://stac-browser-edrs.subdomain.example.com,http://localhost:8080

tempo:
  # -- Grafana tempo endpoint.
  endpoint: http://alloy.monitoring.svc.cluster.local:4317

otel:
  # -- Trace request headers with OpenTelemetry ?
  trace_headers: false
  # -- Trace request bodies and response contents with OpenTelemetry ?
  trace_body: false
