apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-search-service-config
  namespace: {{ .Values.namespace }}
data:
  {{ .Values.app.edrsSearchConfigFile }}: |
    {{ .Files.Get (printf "config/%s" .Values.app.edrsSearchConfigFile) | nindent 4 }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-service-config
  namespace: {{ .Values.namespace }}
data:
  {{ .Values.app.edrsStations }}: |
    stations: |
    {{- range $k, $v := .Values.app.station }}
      {{ $k }}:
        service:
          name: {{ $v.service.name }}
          url: {{ $v.service.url }}
          port: {{ $v.service.port }}
        domain: {{ $v.domain }}
        authentication:
          auth_type: {{ $v.authentication.auth_type }}
          username: {{ $v.authentication.username | quote }}
          password: {{ $v.authentication.password | quote }}
          ca_crt: {{ $v.authentication.ca_crt }}
          client_crt: {{ $v.authentication.client_crt }}
          client_key: {{ $v.authentication.client_key }}
    {{- end }}
