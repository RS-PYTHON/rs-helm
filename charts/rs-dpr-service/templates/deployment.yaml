kind: Deployment
apiVersion: apps/v1
metadata:
  name: {{ .Release.Name }}
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "mychart.Labels" . | nindent 4 }}
spec:
  selector:
    matchLabels:
      {{- include "mychart.selectorLabels" . | nindent 6 }}
  replicas: {{ .Values.replicaCount }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 100%
      maxUnavailable: 50%
  template:
    metadata:
      name: {{ .Release.Name }}
      labels:
        {{- include "mychart.selectorLabels" . | nindent 8 }}
    spec:
      terminationGracePeriodSeconds: 30
      {{- with .Values.initContainers }}
      initContainers:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
      - name: {{ .Release.Name }}
        image: "{{ template "mychart.image" .Values.image }}"
        imagePullPolicy: {{ .Values.image.PullPolicy }}
        resources:
          requests:
            memory: {{ .Values.resources.request.ram }}
            cpu: {{ .Values.resources.request.cpu }}
          limits:
            memory: {{ .Values.resources.limit.ram }}
            cpu: {{ .Values.resources.limit.cpu }}
        volumeMounts:
        - name: rs-server-dpr-service-bucket-configmap
          mountPath: {{ .Values.app.confDir }}
        ports:
        - name: web
          protocol: TCP
          containerPort: {{ .Values.app.port }}
        envFrom:
        {{- range $k, $v := .Values.app.station }}
        - secretRef:
            name: {{ $v.type }}-{{ $k }}
        {{- end }}
        - secretRef:
            name: {{ .Release.Name }}-auth
        - secretRef:
            name: {{ .Release.Name }}-postgres
        - secretRef:
            name: {{ .Release.Name }}-obs
        - secretRef:
            name: {{ .Release.Name }}-jupyterhub-api-token
        env:        
        - name: RSPY_DASK_DPR_SERVICE_CLUSTER_NAME
          value:  {{ .Values.dask.clusterName }}
        - name: RSPY_DASK_DPR_SERVICE_MOCKUP_CLUSTER_NAME
          value:  {{ .Values.dask.clusterName }}
        - name: RSPY_UAC_CHECK_URL
          value: {{ .Values.app.uacUrl }}
        - name: RSPY_UAC_HOMEPAGE
          value: {{ .Values.app.uacHomeUrl }}
        - name: RSPY_DOCS_URL
          value: {{ .Values.app.docsUrl }}
        - name: DASK_GATEWAY__ADDRESS
          value: {{ .Values.dask.gateway_address }}
        - name: DASK_GATEWAY__MOCKUP_ADDRESS
          value: {{ .Values.dask.gateway_address }}
        - name: DASK_GATEWAY__AUTH__TYPE
          value: {{ .Values.dask.gateway_auth_type }}
        - name: POSTGRES_PORT
          value: {{ .Values.postgres.port | quote }}
        - name: POSTGRES_DB
          value: {{ .Values.postgres.db }}
        - name: POSTGRES_HOST
          value: {{ .Values.postgres.host }}
        {{ if .Values.tempo }}
        {{ if .Values.tempo.endpoint }}
        - name: TEMPO_ENDPOINT
          value: {{ .Values.tempo.endpoint }}
        {{ end }}
        {{ end }}
        - name: S3_ENDPOINT
          value: {{ .Values.obs.endpoint }}
        - name: S3_REGION
          value: {{ .Values.obs.region }}
        - name: OTEL_PYTHON_REQUESTS_TRACE_HEADERS
          value: {{ .Values.otel.trace_headers | quote }}
        - name: OTEL_PYTHON_REQUESTS_TRACE_BODY
          value: {{ .Values.otel.trace_body | quote }}
        - name: BUCKET_CONFIG_FILE_PATH
          value: {{ .Values.app.confDir }}/{{ .Values.app.bucketConfig.bucketConfigFileName }}
        securityContext:
          privileged: false
        {{ if .Values.probe }}
        {{ if .Values.probe.startup }}
        startupProbe:
          httpGet:
            path: {{ .Values.probe.startup.path }}
            port: {{ .Values.probe.startup.port }}
          initialDelaySeconds: {{ .Values.probe.startup.initialDelaySeconds }}
          periodSeconds: {{ .Values.probe.startup.periodSeconds }}
          timeoutSeconds: {{ .Values.probe.startup.timeoutSeconds }}
        {{ end }}
        {{ if .Values.probe.liveness }}
        livenessProbe:
          httpGet:
            path: {{ .Values.probe.liveness.path }}
            port: {{ .Values.probe.liveness.port }}
          initialDelaySeconds: {{ .Values.probe.liveness.initialDelaySeconds }}
          periodSeconds: {{ .Values.probe.liveness.periodSeconds }}
          timeoutSeconds: {{ .Values.probe.liveness.timeoutSeconds }}
        {{ end }}
        {{ if .Values.probe.readiness }}
        readinessProbe:
          httpGet:
            path: {{ .Values.probe.readiness.path }}
            port: {{ .Values.probe.readiness.port }}
          initialDelaySeconds: {{ .Values.probe.readiness.initialDelaySeconds }}
          periodSeconds: {{ .Values.probe.readiness.periodSeconds }}
          timeoutSeconds: {{ .Values.probe.readiness.timeoutSeconds }}
        {{ end }}
        {{ end }}
      {{ if .Values.image }}
      {{ if .Values.image.imagePullSecrets }}
      imagePullSecrets:
      - name:  {{ .Values.image.imagePullSecrets }}
      {{ end }}
      {{ end }}
      restartPolicy: Always
      securityContext: {}
      volumes:
        - name: service-config-volume
          configMap:
            name: {{ .Release.Name }}-service-config
        - name: service-openapi-volume
          configMap:
            name: {{ .Release.Name }}-service-openapi
        - name: rs-server-dpr-service-bucket-configmap
          configMap:
            {{ if .Values.app.bucketConfig.useExternalDprServiceBucketConfigMap }}
            name: {{ .Values.app.bucketConfig.externalDprServiceBucketConfigMapName }}
            {{ else }}
            name: default-{{ .Chart.Name }}-bucket-config
            {{ end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
  revisionHistoryLimit: 10