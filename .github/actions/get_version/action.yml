name: publish-get_version
description: Get the rs-server version tags

outputs:
  APP_VERSION:
    description: "Version tag of rs-server git repository"
    value: ${{ steps.get_version.outputs.APP_VERSION }}
  IMAGE_VERSION:
    description: "Version tag of rs-server docker images"
    value: ${{ steps.get_version.outputs.IMAGE_VERSION }}
  CHART_VERSION:
    description: "Helm-compatible chart version"
    value: ${{ steps.get_version.outputs.CHART_VERSION }}

runs:
  using: "composite"
  steps:
      - name: Get the rs-server version tag
        id: get_version
        shell: bash
        run: ${{ github.workspace }}/.github/common/resources/get-version.sh
