name: Generate Helm documentation
on:
  - pull_request
jobs:
  generate:
    runs-on: ubuntu-latest
    permissions: write-all
    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ github.event.pull_request.head.ref }}

    - name: Get the rs-server version tag
      id: get_version
      uses: ./.github/actions/get_version

    - name: Update version number in Chart.yaml
      shell: bash
      run: |
        for chart in $(find charts -name Chart.yaml); do
          sed -i -e "s,{{APP_VERSION}},${{ steps.get_version.outputs.APP_VERSION }}," \
                 -e "s,{{CHART_VERSION}},${{ steps.get_version.outputs.CHART_VERSION }}," \
                 "$chart"
        done

    - name: Run helm-docs
      uses: losisin/helm-docs-github-action@v1.1.4
      with:
        git-push: true
        chart-search-root: ./charts
